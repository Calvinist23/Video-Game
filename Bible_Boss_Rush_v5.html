<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bible Boss Rush — The Scripture Trials</title>
<style>
:root{--gold:#c9ae77;--bright:#f8dc9e;--bg:#080c15;--panel:#111825;--line:#64573d;--ink:#f4eee0;--muted:#a7aeb9;--red:#df707c;--green:#7fcfb3}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#1d2438 0%,#070a11 62%);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.62}
button:focus-visible,input:focus-visible{outline:3px solid #d4b477;outline-offset:3px}
#app{max-width:1440px;margin:auto;min-height:100vh;border-left:1px solid #282e3c;border-right:1px solid #282e3c}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px clamp(20px,3vw,42px);border-bottom:1px solid #595137;background:linear-gradient(90deg,#101723e8,#171b2aed)}
.brand-icon{color:var(--bright);font-size:25px;margin-right:12px}
.brand{font-family:Georgia,serif;font-size:clamp(17px,2.25vw,30px);font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.subbrand{font-size:10px;letter-spacing:.31em;color:var(--gold);margin-top:5px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.27em;text-transform:uppercase;color:#d0b480}
button.minor{border:1px solid #807254;color:#e2d4b5;background:#151b29;padding:9px 13px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
button.minor:hover{background:#2b2b33}
.page{padding:clamp(16px,3.2vw,42px)}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;letter-spacing:.02em;margin:0}
h1{font-size:clamp(32px,4vw,57px);line-height:1.06}h2{font-size:clamp(22px,2vw,32px)}
.gold{color:#e5c68d}.muted{color:var(--muted)}
.surface{background:linear-gradient(140deg,#151b2b,#0c101a);border:1px solid #6b6048;position:relative;box-shadow:0 18px 42px #0005}
.surface:before,.surface:after{content:'◆';position:absolute;color:#c5a570;font-size:8px;top:-6px}.surface:before{left:-5px}.surface:after{right:-5px}
.section-header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:19px 23px;border-bottom:1px solid #514935}
.section-body{padding:23px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:12px 0 27px}
.intro p{max-width:600px;line-height:1.6;color:#aab0be;font-size:14px}
.mini-stamp{font-family:Georgia,serif;color:#cbaf7f;border:1px solid #6a5b40;padding:10px 13px;letter-spacing:.13em;font-size:12px}
.fieldrow{display:grid;grid-template-columns:minmax(180px,2fr) 105px;gap:14px;max-width:540px}
label.field{display:block;font-size:11px;letter-spacing:.13em;color:#a7abb6;text-transform:uppercase;margin-bottom:8px}
input[type=text],input[type=number]{width:100%;background:#0a101b;color:white;border:1px solid #6b6254;padding:13px 14px;border-radius:0}
.class-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:20px}
.class-tile{padding:14px 4px 12px;border:1px solid #3c475a;background:linear-gradient(#1d2537,#111827);color:#ede3d2;display:flex;align-items:center;flex-direction:column;gap:4px;position:relative;min-width:0}
.class-tile.active{background:linear-gradient(#3b3640,#171c29);border-color:#dfbc7d;box-shadow:inset 0 0 0 1px #ad8b5e}
.class-tile:hover{border-color:#ebcb8e;transform:translateY(-2px)}
.class-tile img{image-rendering:pixelated;height:105px;width:84px;object-fit:contain;filter:drop-shadow(0 6px 2px #0008)}
.class-tile span{font-family:Georgia,serif;font-size:clamp(12px,1.4vw,20px)}.class-tile em{color:#a3acbf;font-size:10px;font-style:normal;letter-spacing:.1em}
.class-info{border-left:2px solid #c9ab74;background:#111722;min-height:106px;padding:17px 19px;margin:17px 0 21px;display:grid;gap:7px}
.class-info strong{font-family:Georgia,serif;color:#e6c68b;font-weight:400;font-size:21px}
.class-info p{margin:0;line-height:1.55;color:#c5c9d0;font-size:13px}
.palette{display:flex;flex-wrap:wrap;gap:11px;margin:11px 0 22px}
.swatch{width:33px;height:33px;border:2px solid #0a0e15;outline:1px solid #686d77;box-shadow:0 3px 8px #0008}
.swatch.active{outline:2px solid #e9d1a0;outline-offset:2px}
.primary{padding:13px 24px;background:linear-gradient(105deg,#d3b580,#ecd7a6);border:1px solid #fff0bb;color:#141823;font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;min-height:45px}
.primary:hover:not(:disabled){filter:brightness(1.1)}.primary.dark{color:#f3e5d3;border:1px solid #bba476;background:linear-gradient(100deg,#292839,#171d2b)}
.add-row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.roster-card{display:flex;align-items:center;gap:8px;background:#111929;border:1px solid #435069;padding:8px 7px}
.roster-card img{width:48px;height:60px;object-fit:contain;image-rendering:pixelated;flex:none}
.roster-card .nm{font-family:Georgia,serif;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster-card small{color:#a8b3c3;font-size:11px;letter-spacing:.06em}
.roster-card button{background:none;border:0;color:#d48b90;margin-left:auto;font-size:22px}
.banks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bank{padding:18px;border:1px solid #3f4b60;background:#111929;display:flex;align-items:center;gap:12px;cursor:pointer}
.bank:has(input:checked){border-color:#c8a775;background:#252638}
.bank input{width:17px;height:17px;accent-color:#c7ae80}
.bank b{font-size:13px;letter-spacing:.08em}
.bank small{display:block;font-size:12px;color:#aab3be;margin-top:6px}
.battle-head{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:14px;align-items:center;padding:18px 28px}
.boss-head{text-align:right}.boss-head h2{font-size:clamp(19px,2vw,29px)}
.thin-rule{height:1px;background:linear-gradient(90deg,transparent,#ac8a57,transparent)}
.chapter{font-family:Georgia,serif;font-size:clamp(24px,2.9vw,39px);text-align:center;margin:4px 0;color:#e4c68f}
.chapter span{display:block;font-family:Arial,sans-serif;font-size:10px;color:#aaa8ad;letter-spacing:.27em;margin-top:7px;text-transform:uppercase}
.boss-meter{height:6px;background:#3a2a33;border:1px solid #816a61;margin-top:12px;overflow:hidden}
.boss-meter>div{height:100%;background:linear-gradient(90deg,#ad4d5b,#fb8b88);transition:width .6s}
.arena{height:min(58vw,665px);min-height:480px;position:relative;overflow:hidden;background-size:cover;background-position:center center;border-top:1px solid #6c6049;border-bottom:1px solid #6b5b43;isolation:isolate}
.arena:before{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,#060a160b 0%,transparent 40%,#080b18aa 89%,#080b18e6 100%),linear-gradient(90deg,#04081060,transparent 22%,transparent 78%,#04081050);pointer-events:none}
.arena:after{content:'';position:absolute;inset:0;border:10px solid #070e1a4f;box-shadow:inset 0 0 80px #0006;pointer-events:none;z-index:6}
.ambient{position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 70% 45%,#c5a45b1b,transparent 35%);pointer-events:none}
.combatant{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;transform-origin:center bottom}
.combatant img{display:block;image-rendering:pixelated;object-fit:contain;filter:drop-shadow(0px 7px 0px #05080a94) drop-shadow(0 0 14px #010409)}
.combatant.hero{left:13%;bottom:27%;width:17%;height:34%;animation:idleHero 2.9s ease-in-out infinite}
.combatant.hero img{height:100%;max-width:100%}
.combatant.enemy{right:3%;bottom:26%;height:63%;width:32%;animation:idleBoss 3.8s ease-in-out infinite}
.combatant.enemy img{height:100%;max-width:100%}
.combatant.enemy.hit img,.combatant.hero.hit img{animation:hurt 0.72s steps(2,end) both}
.combatant.enemy.hit,.combatant.hero.hit{animation:shake .62s steps(3,end) both}
@keyframes idleHero{50%{transform:translateY(-5px)}}@keyframes idleBoss{50%{transform:translateY(-8px)}}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(12px,-2px)}31%{transform:translate(-13px,2px)}48%{transform:translate(10px,-2px)}65%{transform:translate(-8px,2px)}82%{transform:translate(6px,-1px)}}
@keyframes hurt{0%,35%,70%{filter:brightness(0) saturate(100%) invert(23%) sepia(91%) saturate(700%) hue-rotate(315deg) brightness(1.65) drop-shadow(0 0 24px #ff425b)}20%,52%,86%{filter:brightness(1.9) saturate(0) drop-shadow(0 0 16px #f55)}100%{filter:drop-shadow(0 8px 0 #05080a70)}}
.question-shell{position:absolute;z-index:4;top:3%;left:50%;transform:translateX(-50%);width:min(570px,53%);background:linear-gradient(160deg,#101725ee,#0b101ee9);border:1px solid #b59969;box-shadow:0 0 0 4px #04080da8,0 16px 40px #020409a8;text-align:center;padding:14px 21px 12px}
.question-shell:before,.question-shell:after{content:'◆';position:absolute;color:#ddbf89;top:-10px;font-size:13px}.question-shell:before{left:-8px}.question-shell:after{right:-8px}
.question-shell .ref{font-size:10px;letter-spacing:.22em;color:#c9ac77;text-transform:uppercase}
.question-shell .prompt{font-family:Georgia,serif;font-size:clamp(17px,1.8vw,26px);line-height:1.25;margin:8px auto 12px;max-width:530px;text-shadow:0px 2px 5px #000}
.timer-row{display:flex;align-items:center;gap:10px}
.timer{height:4px;flex:1;background:#323646;overflow:hidden}
.timer div{height:100%;width:100%;background:#d1b177;transition:width .08s linear}
.timer.red div{background:#ec6677}.timer-label{font-size:11px;color:#e2d0ad;letter-spacing:.08em;min-width:24px}
.hero-hud,.enemy-hud{position:absolute;z-index:4;bottom:24%;min-width:180px;background:#101724df;box-shadow:0 8px 25px #0007;backdrop-filter:blur(4px);border:1px solid #7d6b4a;padding:12px 16px}
.hero-hud{left:2%}.enemy-hud{right:2%;top:22%;bottom:auto;text-align:right;min-width:205px}
.hud-name{font-family:Georgia,serif;font-size:23px;line-height:1.2}
.hud-caption{font-size:10px;letter-spacing:.16em;color:#a8a8ba;text-transform:uppercase;margin:5px 0 12px}
.hp-track{height:6px;background:#373643;overflow:hidden;margin:8px 0 3px}.hp-track div{height:100%;background:linear-gradient(90deg,#a83f59,#e97578);transition:width .5s}
.hp-caption{display:flex;justify-content:space-between;gap:24px;font-size:11px;letter-spacing:.08em;color:#e4d6c9}.enemy-hud .hp-track{height:11px;margin:10px 0 2px;border:1px solid #826c58;border-radius:2px}.enemy-hud .hp-track div{background:linear-gradient(90deg,#933850,#ed747b)}.enemy-hud .eyebrow{font-size:10px}
.bottom-panel{position:absolute;z-index:4;left:0;bottom:0;width:100%;min-height:23%;background:linear-gradient(180deg,#090e1cc9,#070b14f7);border-top:1px solid #af9060;display:grid;grid-template-columns:minmax(155px,.75fr) minmax(410px,2fr) minmax(180px,.75fr);gap:20px;align-items:center;padding:14px clamp(16px,2.8vw,34px)}
.action-title{font-family:Georgia,serif;font-size:20px;color:#e2c289}.action-sub{color:#a6adb8;font-size:12px;line-height:1.6;margin-top:8px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.answer{background:linear-gradient(110deg,#202539ed,#151e2eed);border:1px solid #7b6d56;min-height:53px;display:flex;align-items:center;color:#f6e8cc;text-align:left;padding:8px 12px;font-family:Georgia,serif;font-size:clamp(13px,1.22vw,19px);gap:10px;transition:background .18s,border .18s,transform .18s}
.answer .no{flex:none;display:grid;place-items:center;width:30px;height:30px;border:1px solid #9c835c;transform:rotate(45deg);font-family:Arial,sans-serif;font-size:11px;margin:0 6px}
.answer .no span{transform:rotate(-45deg)}
.answer:hover:not(:disabled){background:#4c4350;border-color:#edcc90;transform:translateY(-2px)}
.answer.correct{border-color:#63b996;background:#173d37}.answer.wrong{border-color:#d8757c;background:#512630}
.party-column{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#bdc0c7}
.party-chip{border-bottom:1px solid #424c5a;padding:5px 0;display:flex;justify-content:space-between;gap:9px}
.party-chip.selected{color:#f6d797}.party-chip.dead{opacity:.4}
.fx-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx-stroke{position:absolute;left:66%;top:37%;width:19%;height:8px;border-radius:100%;background:#fff5d6;box-shadow:0 0 16px #fff,0 0 27px #f8c282;transform:rotate(-43deg) scaleX(0);animation:slash .76s ease-out both}
.fx-stroke.second{transform:rotate(43deg) scaleX(0);animation:xslash .76s ease-out both}
@keyframes slash{0%,12%{transform:rotate(-43deg) scaleX(0);opacity:0}24%{opacity:1}55%{transform:rotate(-43deg) scaleX(1.2);opacity:1}100%{transform:rotate(-43deg) scaleX(.85);opacity:0}}
@keyframes xslash{0%,20%{transform:rotate(43deg) scaleX(0);opacity:0}30%{opacity:1}68%{transform:rotate(43deg) scaleX(1.25)}100%{transform:rotate(43deg) scaleX(.9);opacity:0}}
.arrow-fx{position:absolute;left:28%;top:54%;font-size:55px;color:#ffdfa1;text-shadow:0 0 10px #fff7c3;animation:arrow .8s linear both}
@keyframes arrow{0%{left:28%;top:54%;transform:rotate(-10deg) scale(.8);opacity:0}15%{opacity:1}68%{left:74%;top:51%;transform:rotate(-10deg) scale(1.2);opacity:1}100%{left:78%;top:51%;opacity:0}}
.fire-fx{position:absolute;left:29%;top:57%;width:55px;height:55px;border-radius:50%;background:radial-gradient(circle,#fffcb4 5%,#ffd05c 37%,#ea5932 67%,transparent 80%);box-shadow:0 0 35px #e86647;animation:fire .8s ease-in-out both}
@keyframes fire{0%{left:29%;top:57%;transform:scale(.3);opacity:0}20%{opacity:1}62%{left:72%;top:48%;transform:scale(1)}83%{left:75%;top:48%;transform:scale(2.4);opacity:1}100%{left:76%;top:48%;transform:scale(3);opacity:0}}
.flurry-fx{position:absolute;left:73%;top:44%;width:11%;height:9%;border:7px solid #ffeac3;border-left:0;border-bottom:0;box-shadow:6px -6px #e0a46d;transform:skew(-20deg);animation:flurry .65s steps(4,end) both}
.flurry-fx.f2{animation-delay:.09s;left:70%;top:52%;transform:skew(17deg) rotate(180deg)}
.flurry-fx.f3{animation-delay:.17s;left:77%;top:50%;transform:skew(-17deg) rotate(60deg)}
@keyframes flurry{0%,100%{opacity:0;scale:.4}30%,75%{opacity:1;scale:1.2}}
.hitword{position:absolute;top:44%;left:24%;font-family:Georgia,serif;font-size:clamp(30px,4vw,60px);font-style:italic;color:#f9cfb9;text-shadow:0 0 15px #f33,3px 3px 0 #5c142b;animation:hitword .78s both}
.hitword.enemyword{left:70%;top:36%}
@keyframes hitword{0%{transform:translateY(10px) scale(.3);opacity:0}25%{transform:translateY(-15px) scale(1.15);opacity:1}80%{opacity:1}100%{transform:translateY(-35px);opacity:0}}
.impact-burst{position:absolute;top:44%;left:77%;width:110px;height:110px;border:3px dashed #ffe5a4;transform:rotate(45deg);box-shadow:0 0 28px #fb7b52;animation:burst .75s both}
.impact-burst.hurt{left:20%;top:48%;border-color:#ff7272;box-shadow:0 0 27px #f44}
@keyframes burst{0%{opacity:0;transform:rotate(0) scale(.15)}30%{opacity:1;transform:rotate(30deg) scale(1)}100%{opacity:0;transform:rotate(70deg) scale(1.6)}}
.battle-dialog{position:absolute;z-index:6;left:50%;bottom:24%;transform:translateX(-50%);width:min(520px,66%);background:linear-gradient(145deg,#121928f4,#0b101df4);border:1px solid #c0a574;padding:18px 24px;text-align:center;box-shadow:0 20px 45px #03060bbb}
.battle-dialog h3{font-family:Georgia,serif;color:#edcf92;font-size:clamp(20px,2vw,30px)}
.battle-dialog p{font-size:13px;color:#d0ced0;line-height:1.6;margin:9px 0 12px}
.battle-dialog .dialog-controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.foot-roster{border-top:1px solid #574f43;background:#0d121e;padding:15px 26px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.party-token{display:flex;align-items:center;gap:7px;border:1px solid #4c5465;padding:5px 12px 5px 5px;background:#172032;font-size:12px;min-width:135px}
.party-token img{width:33px;height:42px;image-rendering:pixelated;object-fit:contain}.party-token.current{border-color:#c9a870;background:#30303c}.party-token.down{opacity:.44}
.party-token strong{display:block;font-family:Georgia,serif;font-weight:400;font-size:15px}
.party-token span{color:#acb5c0;font-size:11px}
.conclusion{min-height:500px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#34304a,#090d19 65%);text-align:center;padding:45px 20px}
.conclusion .seal{font-size:60px;color:#e4c785;margin-bottom:20px}
.conclusion p{max-width:600px;line-height:1.7;color:#c9c9d4;margin:16px auto 26px}
@media(max-width:950px){.bottom-panel{grid-template-columns:1fr 2fr;gap:12px}.party-column{display:none}.battle-controls{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.battle-controls .primary{width:auto;min-width:145px}.battle-controls .control-tip{font-size:11px}.combatant.hero{height:31%;width:18%;left:10%}.combatant.enemy{height:51%;right:0}.question-shell{width:66%}.hero-hud{bottom:28%}.enemy-hud{top:27%}.arena{min-height:545px;height:75vw}}
@media(max-width:630px){.header{padding:12px 15px}.brand{font-size:15px}.subbrand{font-size:9px}.intro{display:block}.mini-stamp{display:none}.fieldrow,.banks{grid-template-columns:1fr}.class-grid{grid-template-columns:repeat(3,1fr)}.class-tile img{height:80px;width:64px}.section-body{padding:15px}.battle-head{padding:13px;gap:5px;grid-template-columns:.75fr 1.2fr .75fr}.battle-head .eyebrow{font-size:9px}.boss-head h2{font-size:13px}.chapter{font-size:19px}.chapter span{font-size:8px}.arena{height:660px;min-height:660px;background-position:center}.combatant.hero{left:7%;bottom:47%;height:22%;width:27%}.combatant.enemy{right:-7%;bottom:47%;height:34%;width:48%}.question-shell{width:94%;top:2%;padding:10px 12px}.question-shell .prompt{font-size:18px;margin:5px 0}.hero-hud{bottom:42%;left:2%;min-width:130px;padding:7px}.enemy-hud{top:30%;right:2%;min-width:125px;padding:7px}.hud-name{font-size:15px}.hud-caption{font-size:9px;margin:3px 0}.bottom-panel{min-height:38%;grid-template-columns:1fr;align-content:start;gap:9px;padding:13px}.battle-controls{grid-column:auto}.battle-controls .primary{width:100%;min-width:0}.action-title{font-size:16px}.action-sub{display:none}.answers{gap:7px}.answer{min-height:53px;font-size:14px;padding:6px}.answer .no{width:20px;height:20px;margin:0 2px}.battle-dialog{width:92%;bottom:38%}.foot-roster{padding:9px}.party-token{min-width:115px}.party-token img{width:26px;height:32px}.party-token strong{font-size:12px}}

.damage-number{position:absolute;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;pointer-events:none;animation:damagePop .93s cubic-bezier(.15,.73,.27,1) both;filter:drop-shadow(2px 4px 0 #1c0f18)}
.damage-number.enemy-damage{left:75%;top:34%;transform:translate(-50%,-50%)}
.damage-number.hero-damage{left:21%;top:47%;transform:translate(-50%,-50%)}
.damage-amount{font-family:Georgia,serif;font-weight:900;font-size:clamp(38px,5.2vw,76px);line-height:1;-webkit-text-stroke:1.5px #34223a;color:#fff1bd;text-shadow:0 0 15px #f7bf74,3px 3px 0 #3b2023,0 7px 10px #0a0712;white-space:nowrap}
.hero-damage .damage-amount{color:#ff989b;text-shadow:0 0 18px #fb4659,3px 3px 0 #5c172a,0 7px 12px #100711}
.damage-label{font-family:Georgia,serif;letter-spacing:.13em;text-transform:uppercase;font-size:12px;font-weight:bold;color:#ffe4aa;text-shadow:2px 3px 2px #04040a}
@keyframes damagePop{0%{opacity:0;translate:0 26px;scale:.52}18%{opacity:1;translate:0 -13px;scale:1.25}45%{opacity:1;translate:0 -24px;scale:1}82%{opacity:1;translate:0 -39px;scale:1}100%{opacity:0;translate:0 -58px;scale:.94}}
.battle-controls{display:grid;gap:9px;justify-items:stretch;align-content:center}
.battle-controls .primary{width:100%;text-align:center;padding:13px 9px;font-size:11px;letter-spacing:.07em}
.battle-controls .skill-button{display:flex;align-items:center;gap:10px;justify-content:center;background:linear-gradient(95deg,#2b2c4b,#121c2b);border:1px solid #c0aa79;color:#ffebc2;padding:12px 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.battle-controls .skill-button:hover{background:linear-gradient(95deg,#454060,#222d3e)}
.battle-controls .skill-glyph{width:28px;height:28px;display:grid;place-items:center;border:1px solid #a8a4d7;border-radius:4px;background:#221f46;box-shadow:0 0 13px #7065d55d;font-size:19px;color:#cec0ff}
.battle-controls .skill-details{color:#b5a5c8;letter-spacing:.02em;text-transform:none;font-size:12px}
.battle-controls .control-tip{font-size:11px;line-height:1.5;color:#cabfae;text-align:center;letter-spacing:.06em}
.battle-result-note{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:11px 28px;background:#0a101b;border-top:1px solid #373c49}
.battle-result-note details{color:#aab4c6;font-size:12px}
.battle-result-note summary{cursor:pointer;color:#d1b583}
.battle-result-note p{margin:7px 0 0;font-size:12px;line-height:1.5;max-width:800px;color:#c7cbd1}
@media(max-width:630px){.damage-number.enemy-damage{left:79%;top:36%}.damage-number.hero-damage{left:20%;top:42%}.damage-amount{font-size:34px;-webkit-text-stroke:1px #34223a}.battle-controls{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.battle-controls .primary{font-size:10px;padding:9px 7px}.battle-controls .skill-button{padding:8px 7px;font-size:10px}.battle-controls .skill-glyph{width:24px;height:24px;font-size:16px}.battle-controls .control-tip{grid-column:1/-1}.battle-result-note{padding:10px 13px}}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sourceFor(cls,colorIndex){return ASSETS[cls.toLowerCase()+colorIndex]}
function spriteFor(obj){return sourceFor(obj.cls,palette.indexOf(obj.color)<0?1:palette.indexOf(obj.color))}

function rnd(n){return Math.floor(Math.random()*n)+1}
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hpBar(cur,max){return `<div class="hp-track"><div style="width:${Math.max(0,cur/max*100)}%"></div></div>`}
function layout(contents,tag='THE SCRIPTURE TRIALS') {document.getElementById('app').innerHTML=`<header class="header"><div style="display:flex;align-items:center"><span class="brand-icon">✦</span><div><div class="brand">Bible Boss Rush</div><div class="subbrand">THE SCRIPTURE TRIALS · PIXEL RPG</div></div></div><div class="eyebrow" style="text-align:right">${tag}</div></header>${contents}`}
function classInfoTile(cls){let d=CLASSINFO[cls];return `<strong>${cls} · ${d.title}</strong><div class="eyebrow">${d.tag} · ${d.hp} starting HP</div><p>${d.desc}</p>`}
function setup(){stopClock();battle=null;layout(`<main class="page"><div class="intro"><div><div class="eyebrow">THE ADVENTURERS' GUILD</div><h1 style="margin:10px 0">Forge your <span class="gold">legend.</span></h1><p>Create a character for each student, choose your chapters, and send the party against three guardians. Each student keeps their class abilities throughout the adventure.</p></div><div class="mini-stamp">✧ CHRONICLE I ✧</div></div><section class="surface"><div class="section-header"><h2>I. Create an Adventurer</h2><span class="eyebrow">5 Classes · 8 Palettes</span></div><div class="section-body"><div class="fieldrow"><div><label class="field" for="student-name">Student name</label><input id="student-name" type="text" maxlength="22" placeholder="Enter student name" value="${esc(formDraft.name)}"></div><div><label class="field" for="student-level">Level</label><input id="student-level" type="number" min="1" max="99" value="${esc(formDraft.level)}"></div></div><div class="class-grid">${CLASSES.map(c=>`<button type="button" class="class-tile ${c===selClass?'active':''}" data-class="${c}" aria-label="Select ${c}"><img src="${sourceFor(c,selColor)}" alt="${c} character"><span>${c}</span><em>${CLASSINFO[c].tag}</em></button>`).join('')}</div><div id="class-info" class="class-info">${classInfoTile(hoverClass||selClass)}</div><label class="field">Choose costume color</label><div class="palette">${palette.map((c,i)=>`<button type="button" class="swatch ${selColor===i?'active':''}" data-color="${i}" title="Costume color ${i+1}" aria-label="Costume color ${i+1}" style="background:${c}"></button>`).join('')}</div><div class="add-row"><button class="primary" id="add-student">+ Recruit Adventurer</button><span class="muted" style="font-size:12px" id="add-error">Choose a class and recruit up to 50 students.</span></div></div></section><section class="surface" style="margin-top:22px"><div class="section-header"><h2>II. Your Company</h2><span class="eyebrow">${roster.length} ADVENTURERS</span></div><div class="section-body"><div class="roster-grid">${roster.length?roster.map((p,i)=>`<div class="roster-card"><img src="${spriteFor(p)}" alt=""><div style="min-width:0"><div class="nm">${esc(p.name)}</div><small>LV ${p.level} · ${p.cls}</small><br><small>${CLASSINFO[p.cls].hp} HP</small></div><button data-remove="${i}" aria-label="Remove ${esc(p.name)}">×</button></div>`).join(''):'<p class="muted">Your company awaits its first adventurer.</p>'}</div></div></section><section class="surface" style="margin-top:22px"><div class="section-header"><h2>III. Choose the Scriptures</h2><span class="eyebrow">48 QUESTIONS TOTAL</span></div><div class="section-body"><div class="banks"><label class="bank"><input type="checkbox" data-bank="early" ${banks.includes('early')?'checked':''}><span><b>Gospel of John 1–7:13</b><small>24 questions · The signs and discourses</small></span></label><label class="bank"><input type="checkbox" data-bank="late" ${banks.includes('late')?'checked':''}><span><b>Gospel of John 7:14–12:50</b><small>24 questions · The Light of the World</small></span></label></div><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:24px"><div class="muted" style="font-size:12px">30-second turns · 1d20 + level · bosses have 130 / 160 / 200 HP</div><button class="primary" id="start">Begin the Trials ↗</button></div></div></section></main>`,'PREPARE THE COMPANY');
 const nm=document.getElementById('student-name'),lv=document.getElementById('student-level');
 const keep=()=>{formDraft={name:nm.value,level:lv.value}};
 nm.oninput=keep;lv.oninput=keep;nm.onkeydown=e=>{if(e.key==='Enter')document.getElementById('add-student').click()};
 document.querySelectorAll('[data-class]').forEach(el=>{const c=el.dataset.class;el.onmouseenter=()=>{document.getElementById('class-info').innerHTML=classInfoTile(c)};el.onfocus=()=>{document.getElementById('class-info').innerHTML=classInfoTile(c)};el.onclick=()=>{keep();selClass=c;hoverClass=null;setup()}});
 document.querySelector('.class-grid').onmouseleave=()=>{document.getElementById('class-info').innerHTML=classInfoTile(selClass)};
 document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{keep();selColor=Number(el.dataset.color);setup()});
 document.getElementById('add-student').onclick=()=>{keep();const n=formDraft.name.trim(),l=Number(formDraft.level);if(!n){document.getElementById('add-error').textContent='Please enter a student name.';return}if(!Number.isInteger(l)||l<1||l>99){document.getElementById('add-error').textContent='Enter a level between 1 and 99.';return}if(roster.length>=50){document.getElementById('add-error').textContent='The company is full (50 students).';return}roster.push({id:String(Date.now())+'-'+Math.random(),name:n,level:l,cls:selClass,color:palette[selColor]});formDraft={name:'',level:formDraft.level};save();setup()};
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{roster.splice(Number(el.dataset.remove),1);save();setup()});
 document.querySelectorAll('[data-bank]').forEach(el=>el.onchange=()=>{banks=[...document.querySelectorAll('[data-bank]:checked')].map(x=>x.dataset.bank)});
 document.getElementById('start').onclick=()=>{keep();if(!roster.length){alert('Recruit at least one adventurer first.');return}if(!banks.length){alert('Choose at least one question bank.');return}startBattle()};
}
function startBattle(){stopClock();battle={party:roster.map(p=>({...p,max:CLASSINFO[p.cls].hp,hp:CLASSINFO[p.cls].hp,slots:p.cls==='Mage'?3:0})),boss:0,bossHp:BOSSES[0].hp,qpool:shuffle(banks.flatMap(k=>Q[k])),used:0,turn:0,pick:null,last:null,question:null,state:'new',seconds:30,clockEnd:0,choice:null,message:'',effect:null,pending:null,correct:false};nextTurn()}
function alive(){return battle.party.filter(p=>p.hp>0)}
function stopClock(){if(tick!==null){clearInterval(tick);tick=null}if(animTimeout){clearTimeout(animTimeout);animTimeout=null}}
function nextTurn(){stopClock();if(battle.bossHp<=0){if(battle.boss===2){end(true);return}between();return}if(alive().length===0){end(false);return}if(battle.used>=battle.qpool.length){battle.qpool=shuffle(banks.flatMap(k=>Q[k]));battle.used=0}let candidates=alive().filter(p=>p.id!==battle.last);if(!candidates.length)candidates=alive();battle.pick=candidates[Math.floor(Math.random()*candidates.length)];battle.last=battle.pick.id;battle.question=battle.qpool[battle.used++];battle.turn++;battle.seconds=30;battle.state='question';battle.choice=null;battle.message='';battle.effect=null;battle.pending=null;battle.clockEnd=performance.now()+30000;renderBattle();tick=setInterval(updateClock,80)}
function updateClock(){if(!battle||battle.state!=='question')return;const remain=Math.max(0,(battle.clockEnd-performance.now())/1000);battle.seconds=remain;const num=document.getElementById('countdown'),bar=document.getElementById('countbar');if(num)num.textContent=String(Math.ceil(remain)).padStart(2,'0');if(bar){bar.style.width=(remain/30*100)+'%';bar.parentElement.classList.toggle('red',remain<=8)}if(remain<=0)resolve(-1)}
function heroEffect(cls){return ({Knight:'knight',Assassin:'assassin',Archer:'archer',Mage:'mage',Fighter:'fighter'})[cls]}
function resolve(choice){if(!battle||battle.state!=='question')return;const secs=Math.max(0,(battle.clockEnd-performance.now())/1000);if(secs<=0)choice=-1;stopClock();const p=battle.pick,correct=choice===battle.question[3],info=CLASSINFO[p.cls];let pending={correct,choice,delta:0,critical:false,spell:false};if(correct){let die=rnd(20),damage=die+p.level+(info.atk||0);if(p.cls==='Assassin'&&secs>20)damage+=rnd(6);if(p.cls==='Archer'){let chance=secs/2;if(Math.random()*100<chance){damage=Math.round(damage*1.5);pending.critical=true}}pending.delta=damage}else{let die=rnd(30),damage=Math.max(0,die-(info.block||0));pending.delta=damage}battle.pending=pending;battle.state='anim';battle.effect=correct?heroEffect(p.cls):'hurt';renderBattle();animTimeout=setTimeout(()=>{animTimeout=null;if(!battle||battle.state!=='anim')return;finishAttack()},880)}
function finishAttack(){const p=battle.pick,r=battle.pending;if(r.correct){battle.bossHp=Math.max(0,battle.bossHp-r.delta)}else{p.hp=Math.max(0,p.hp-r.delta)}battle.message=r.correct?'A clean hit!':'The guardian strikes back!';battle.choice=r.choice;battle.correct=r.correct;battle.state=(r.correct&&p.cls==='Mage'&&p.slots>0&&battle.bossHp>0)?'mage':'result';battle.effect=null;battle.pending=null;renderBattle()}
function spendSpell(){if(battle.state!=='mage'||battle.pick.slots<=0)return;const a=rnd(10),b=rnd(10);battle.pick.slots--;battle.pending={correct:true,delta:a+b,choice:battle.choice,spell:true,critical:false};battle.state='anim';battle.effect='mage';renderBattle();animTimeout=setTimeout(()=>{animTimeout=null;const r=battle.pending;if(!battle||!r)return;battle.bossHp=Math.max(0,battle.bossHp-r.delta);battle.message='Arcane Burst!';battle.pending=null;battle.state='result';battle.effect=null;renderBattle()},880)}
function saveSpell(){if(battle.state!=='mage')return;battle.message='Spell conserved.';battle.state='result';renderBattle()}
function stageEffect(){const e=battle.effect;if(!e)return '';
 const p=battle.pending||{delta:0};
 const number=`<div class="damage-number ${e==='hurt'?'hero-damage':'enemy-damage'}" role="status"><span class="damage-amount">${p.delta}</span>${p.critical?'<span class="damage-label">Critical!</span>':p.spell?'<span class="damage-label">Arcane Burst</span>':''}</div>`;
 if(e==='hurt')return `<div class="impact-burst hurt"></div><div class="hitword">HIT!</div>${number}`;
 const burst=`<div class="impact-burst"></div>${number}`;
 if(e==='knight')return '<div class="fx-stroke"></div>'+burst;
 if(e==='assassin')return '<div class="fx-stroke"></div><div class="fx-stroke second"></div>'+burst;
 if(e==='archer')return '<div class="arrow-fx">➶</div>'+burst;
 if(e==='mage')return '<div class="fire-fx"></div>'+burst;
 return '<div class="flurry-fx"></div><div class="flurry-fx f2"></div><div class="flurry-fx f3"></div>'+burst;
}
function battleAction(){
 if(!battle||battle.state==='question')return '<div class="control-tip">Choose an answer to strike.</div>';
 if(battle.state==='anim')return '<div class="control-tip">✧ Combat in motion…</div>';
 if(battle.state==='mage')return `<div class="control-tip" style="color:#dbb9ff">✦ ARCANE BURST READY</div><button class="skill-button" id="spend" title="Spend a spell slot"><span class="skill-glyph" aria-hidden="true">✷</span><span>Arcane Burst</span></button><button class="primary dark" id="save-spell">Conserve</button><div class="control-tip">${battle.pick.slots} spell slot${battle.pick.slots!==1?'s':''} remaining</div>`;
 return `<div class="control-tip">${battle.correct?'✦ STRIKE LANDED':'✦ THE GUARDIAN STRIKES'}</div><button class="primary" id="next">${battle.bossHp<=0?'Guardian defeated ↗':'Next turn →'}</button>`;
}
function renderBattle(){let p=battle.pick,b=BOSSES[battle.boss],q=battle.question;let bust=battle.state==='anim';layout(`<div class="battle-head"><div><div class="eyebrow">ENCOUNTER ${String(battle.boss+1).padStart(2,'0')} / 03</div><div class="muted" style="font-size:12px;margin-top:6px">TURN ${String(battle.turn).padStart(2,'0')} · ${alive().length} SURVIVORS</div></div><div><div class="chapter">${['The Broken Gate','The Unseen Hand','The Final Seal'][battle.boss]}<span>The Scripture Trials</span></div><div class="thin-rule"></div></div><div class="boss-head"><div class="eyebrow">${esc(b.title)}</div><h2>${esc(b.name)}</h2></div></div><div class="arena" style="background-image:url('${ASSETS['bg'+battle.boss]}')"><div class="ambient"></div><div class="combatant hero ${bust&&!battle.pending.correct?'hit':''}"><img src="${spriteFor(p)}" alt="Current ${esc(p.cls)} character"></div><div class="combatant enemy ${bust&&battle.pending.correct?'hit':''}"><img src="${ASSETS['boss'+battle.boss]}" alt="${esc(b.name)}"></div><div class="question-shell"><div class="ref">✦ ${esc(q[0])} · The Guardian's Challenge ✦</div><div class="prompt">${esc(q[1])}</div><div class="timer-row"><div class="timer ${battle.seconds<=8?'red':''}"><div id="countbar" style="width:${Math.max(0,battle.seconds/30*100)}%"></div></div><span class="timer-label" id="countdown">${Math.ceil(battle.seconds)}</span></div></div><div class="hero-hud"><div class="hud-name">${esc(p.name)}</div><div class="hud-caption">Lv ${p.level} · ${p.cls} ${p.cls==='Mage'?'· '+p.slots+' SP':''}</div>${hpBar(p.hp,p.max)}<div class="hp-caption"><span>HEALTH</span><strong>${p.hp} / ${p.max}</strong></div></div><div class="enemy-hud"><div class="eyebrow">✦ GUARDIAN HP</div>${hpBar(battle.bossHp,b.hp)}</div><div class="fx-layer">${stageEffect()}</div><div class="bottom-panel"><div><div class="eyebrow">NOW FIGHTING</div><div class="action-title">${esc(p.name)}'s Turn</div><div class="action-sub">${p.cls==='Mage'?`ARCANE SLOTS: ${p.slots}/3`:`${CLASSINFO[p.cls].tag.toUpperCase()}`}<br>SELECT THE CORRECT ANSWER</div></div><div class="answers">${q[2].map((a,i)=>`<button class="answer ${battle.state!=='question'?(i===q[3]?'correct':i===battle.choice?'wrong':''):''}" data-answer="${i}" ${battle.state==='question'?'':'disabled'}><span class="no"><span>${i+1}</span></span><span>${esc(a)}</span></button>`).join('')}</div><div class="battle-controls"><div class="eyebrow" style="text-align:center">${esc(CLASSINFO[p.cls].tag)}</div>${battleAction()}</div></div></div><div class="foot-roster"><span class="eyebrow" style="margin-right:8px">YOUR COMPANY</span>${battle.party.map(m=>`<div class="party-token ${m.id===p.id?'current':''} ${m.hp<=0?'down':''}"><img src="${spriteFor(m)}" alt=""><div><strong>${esc(m.name)}</strong><span>${m.hp}/${m.max} HP · LV ${m.level}</span></div></div>`).join('')}</div>${battle.state==='result'?`<div class="battle-result-note"><details><summary>✦ Scripture note</summary><p>${esc(q[4])}</p></details></div>`:''}<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 28px;background:#0a101b"><span class="muted" style="font-size:11px">✦ THE SCRIPTURE TRIALS</span><button class="minor" id="exit-game">← Edit party</button></div>`,`CHAPTER ${battle.boss+1} · THE TRIALS`);
 document.querySelectorAll('[data-answer]').forEach(el=>el.onclick=()=>resolve(Number(el.dataset.answer)));
 const next=document.getElementById('next');if(next)next.onclick=nextTurn;
 const spend=document.getElementById('spend');if(spend)spend.onclick=spendSpell;
 const save=document.getElementById('save-spell');if(save)save.onclick=saveSpell;
 document.getElementById('exit-game').onclick=()=>{if(confirm('Return to roster? The active battle will be lost.'))setup()};
}
function between(){stopClock();let defeated=BOSSES[battle.boss];layout(`<div class="conclusion"><div><div class="seal">✧</div><div class="eyebrow">THE SEAL IS BROKEN</div><h1 style="margin:14px 0">${esc(defeated.name)} <span class="gold">Defeated</span></h1><p>Another guardian has fallen. Your surviving adventurers press on, carrying their current HP. Fallen party members remain down. Mages recover three spell slots for the next guardian.</p><button class="primary" id="advance">Enter Encounter ${battle.boss+2} →</button></div></div>`,'THE GATE OPENS');document.getElementById('advance').onclick=()=>{battle.boss++;battle.bossHp=BOSSES[battle.boss].hp;for(const p of battle.party)if(p.cls==='Mage')p.slots=3;battle.last=null;nextTurn()}}
function end(won){stopClock();layout(`<div class="conclusion"><div><div class="seal">${won?'✶':'✕'}</div><div class="eyebrow">${won?'THE SCRIPTURE TRIALS COMPLETE':'THE COMPANY HAS FALLEN'}</div><h1>${won?'<span class="gold">VICTORY</span>':'<span style="color:#d9808a">DEFEAT</span>'}</h1><p>${won?'All three guardians have fallen. The company stands victorious!':'Every adventurer has fallen. Gather a stronger company and face the guardians again.'}<br>${battle.turn} turns played · ${won?3:battle.boss} guardians defeated.</p><div style="display:flex;justify-content:center;gap:14px"><button class="primary" id="again">Rematch</button><button class="primary dark" id="edit">Edit party</button></div></div></div>`);document.getElementById('again').onclick=startBattle;document.getElementById('edit').onclick=setup}
document.addEventListener('keydown',e=>{if(!battle||battle.state!=='question'||e.altKey||e.ctrlKey||e.metaKey)return;if(e.target?.matches('input,textarea'))return;const n=Number(e.key);if(n>=1&&n<=4)resolve(n-1)});
setup();
</script></body></html>
